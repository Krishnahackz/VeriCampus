<!doctype html>
<html lang="en">
<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeriCampus — Student Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #e6edf3;
      font-family: Inter, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px;
      background: rgba(22,27,34,.94);
      border: 1px solid #30363d;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    h1 { font-size: 28px; margin-bottom: 10px; }
    .lead { color: #8b949e; line-height: 1.6; margin-bottom: 24px; }
    .details { display: grid; gap: 10px; margin-bottom: 24px; }
    .detail {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #30363d;
      color: #8b949e;
      font-size: 14px;
    }
    .detail strong { color: #e6edf3; text-align: right; overflow-wrap: anywhere; }
    .status { color: #4ade80; }
    .status.pending { color: #fbbf24; }
    .pending-box {
      margin: 0 0 24px;
      padding: 14px 16px;
      border: 1px solid rgba(251,191,36,.35);
      border-radius: 12px;
      background: rgba(251,191,36,.08);
      color: #fcd34d;
      line-height: 1.5;
      font-size: 14px;
    }
    .pending-box strong { color: #fbbf24; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions button { flex: 1; min-width: 140px; }
    a, button {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: #6366f1;
      border: 1px solid #6366f1;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    a.secondary, button.secondary {
      color: #cbd5e1;
      background: transparent;
      border-color: #30363d;
    }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <main id="app">
    <h1>Student Dashboard</h1>
    <p class="lead">Loading your VeriCampus details…</p>
  </main>

  <script>
    const API = String(
        window.VERICAMPUS_CONFIG?.API_BASE || "/api"
    ).replace(/\/$/, "");

    const token =
        sessionStorage.getItem("vc_student_token") ||
        localStorage.getItem("vc_student_token");

    if (!token) {
        location.replace("/");
    } else {
        loadStudent();
    }


    async function loadStudent() {
        const app = document.getElementById("app");

        try {
            const response = await fetch(
                API + "/student/me",
                {
                    method: "GET",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load student details"
                );
            }

            /*
             * Backend status can be returned as approved/pending.
             */
            const status = String(
                data.status || ""
            ).toLowerCase();

            const isActive = status === "approved";

            const studentId =
                data.student_id ||
                data.studentId ||
                data.id;

            if (!studentId) {
                throw new Error(
                    "Student ID was not returned by server"
                );
            }

            app.innerHTML = `
                <h1>Student Dashboard</h1>

                <p class="lead">
                    ${
                        isActive
                            ? "Your VeriCampus identity is active."
                            : "Your registration has been received and is awaiting teacher verification."
                    }
                </p>

                ${
                    !isActive
                        ? `
                            <div class="pending-box">
                                <strong>⏳ Pending Approval</strong>
                                <br>
                                Your details have been submitted successfully.
                                A teacher must approve your registration before
                                your Digital ID becomes available.
                                You can log in anytime to check your status.
                            </div>
                        `
                        : ""
                }

                <div class="details">

                    <div class="detail">
                        <span>Name</span>
                        <strong></strong>
                    </div>

                    <div class="detail">
                        <span>Student ID</span>
                        <strong></strong>
                    </div>

                    <div class="detail">
                        <span>Email</span>
                        <strong></strong>
                    </div>

                    <div class="detail">
                        <span>Status</span>
                        <strong class="status"></strong>
                    </div>

                </div>

                <div class="actions">

                    ${
                        isActive
                            ? `
                                <a
                                    href="/student.html?id=${encodeURIComponent(studentId)}"
                                >
                                    View Digital ID
                                </a>
                            `
                            : ""
                    }

                    ${
                        isActive
                            ? `
                                <button
                                    type="button"
                                    onclick="downloadDigitalId()"
                                >
                                    Download ID Card
                                </button>
                            `
                            : ""
                    }

                    <button
                        type="button"
                        class="secondary"
                        onclick="loadStudent()"
                    >
                        Check Status
                    </button>

                    <button
                        type="button"
                        class="secondary"
                        onclick="studentLogout()"
                    >
                        Sign Out
                    </button>

                </div>
            `;

            const values =
                app.querySelectorAll(".detail strong");

            values[0].textContent =
                data.name || "—";

            values[1].textContent =
                studentId || "—";

            values[2].textContent =
                data.email || "—";

            values[3].textContent =
                isActive
                    ? "Active"
                    : "Pending Approval";

            values[3].classList.toggle(
                "pending",
                !isActive
            );

        } catch (error) {

            console.error(
                "Student dashboard error:",
                error
            );

            sessionStorage.removeItem(
                "vc_student_token"
            );

            localStorage.removeItem(
                "vc_student_token"
            );

            sessionStorage.removeItem(
                "vc_student"
            );

            localStorage.removeItem(
                "vc_student"
            );

            app.innerHTML = `
                <h1>Student Dashboard</h1>

                <p class="lead error">
                    ${escapeHtml(error.message)}
                </p>

                <div class="actions">
                    <a href="/">
                        Back to Home
                    </a>
                </div>
            `;
        }
    }


    /*
     * OPEN DIGITAL ID
     *
     * This fixes the missing-function error
     * from the Download ID Card button.
     */
    async function downloadDigitalId() {

        try {

            const studentToken =
                sessionStorage.getItem(
                    "vc_student_token"
                ) ||
                localStorage.getItem(
                    "vc_student_token"
                );

            if (!studentToken) {
                location.replace("/");
                return;
            }

            const response = await fetch(
                API + "/student/me",
                {
                    method: "GET",
                    headers: {
                        Authorization:
                            "Bearer " + studentToken
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to load Digital ID"
                );
            }

            const status = String(
                data.status || ""
            ).toLowerCase();

            if (status !== "approved") {

                alert(
                    "Your Digital ID is still pending approval."
                );

                return;
            }

            const studentId =
                data.student_id ||
                data.studentId ||
                data.id;

            if (!studentId) {
                throw new Error(
                    "Student ID not found"
                );
            }

            /*
             * Open the actual Digital ID page.
             * The student.html page handles the ID card,
             * QR and print/download functionality.
             */
            const idUrl =
                "/student.html?id=" +
                encodeURIComponent(studentId);

            const newWindow =
                window.open(
                    idUrl,
                    "_blank"
                );

            if (!newWindow) {
                alert(
                    "Please allow pop-ups for VeriCampus to open your Digital ID."
                );
            }

        } catch (error) {

            console.error(
                "Digital ID error:",
                error
            );

            alert(
                error.message ||
                "Unable to open Digital ID"
            );
        }
    }


    function studentLogout() {

        sessionStorage.removeItem(
            "vc_student_token"
        );

        localStorage.removeItem(
            "vc_student_token"
        );

        sessionStorage.removeItem(
            "vc_student"
        );

        localStorage.removeItem(
            "vc_student"
        );

        location.replace("/");
    }


    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
</script>
</body>
</html>
